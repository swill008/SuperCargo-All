name: CI

# Typecheck, build, then replay the scenario suite and the real-log fixtures
# through the built app under xvfb. Release builds live in release-linux.yml.
on:
  push:
    branches: [features, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # 22: replay.mjs uses Node's built-in WebSocket (Node 20 has none, which failed every CDP scenario)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # ubuntu-latest is 24.04, where libasound2 became libasound2t64.
      - name: Install xvfb and Electron runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
          python3 --version
      # replay.mjs launches Electron with --no-sandbox via xvfb-run.
      - name: Replay scenarios
        run: node test/replay/replay.mjs
      - name: Replay real-log fixtures
        run: node test/replay/run_all.mjs
      # where the disk space went, so a "no space left on device" run names the folder
      - name: Disk use on failure
        if: failure()
        run: |
          df -h / /tmp; df -i /
          du -xsh /tmp/* ~/.config ~/.cache ~/.npm 2>/dev/null | sort -h | tail -20
          du -sh /tmp/sc-replay-*/*/.config /tmp/sc-replay-*/*/.cache /tmp/sc-replay-*/*/SuperCargo-OtherModes 2>/dev/null | sort -h | tail -20
      - name: Upload replay data
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: replay-data
          path: /tmp/sc-replay-*
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

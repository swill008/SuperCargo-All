# electron-builder configuration.
#
# Releases are built by .github/workflows/release-win.yml (Windows: Setup.exe +
# Portable.zip) and release-linux.yml (AppImage). electron-builder never publishes
# (--publish never); the workflow uploads the files to the GitHub release tagged
# SuperCargo-OtherModes-R1-<version> in swill008/SuperCargo-All.
#
# Local build without uploading:  npm run dist   (Windows)   npm run dist:linux
#
# package.json "version" is plain semver (electron-updater compares it); "R1" is
# the release line and goes in the file names, the tag and the release title.
#
appId: space.supercargo.othermodes
productName: SuperCargo-OtherModes
copyright: Copyright © 2026 Travis

directories:
  output: release
  buildResources: build

# electron-vite emits the compiled app into out/
files:
  - out/**/*
  - package.json
  # the live window/taskbar icon is loaded at runtime from ../../resources/icon.png
  # (relative to out/main); the exe + installer icon comes from build/icon.ico.
  - resources/icon.png

# Bundled UEX lists (ships, freight locations, commodities). Shipped as an offline
# seed; the app refreshes them from the repo at launch. Copied to resources/data/uex
# so dataSync.ts can read them via process.resourcesPath.
extraResources:
  - from: data/uex
    to: data/uex
    filter:
      - '*.json'

# tesseract.js loads its worker script + wasm core from disk at runtime; they
# must live outside the asar archive or recognition fails in the packaged app.
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  # onnxruntime-node ships native .node/.dll binaries that can't run from inside asar
  - node_modules/onnxruntime-node/**

# --- Auto-update -----------------------------------------------------------
# electron-updater reads this (app-update.yml in the installed copy) and asks
# github.com/<owner>/<repo>/releases/latest for the newest release's tag, then
# downloads latest.yml from that tag. Any tag name works there (it is not parsed
# as a version), so the tag SuperCargo-OtherModes-R1-<version> is fine; the
# version compared is the one inside latest.yml. The release must be published
# (not a draft or prerelease) and the repo public.
publish:
  provider: github
  owner: swill008
  repo: SuperCargo-All

win:
  # Applies to the zip (electron-builder has no top-level "zip:" section);
  # nsis.artifactName below overrides it for the Setup.exe.
  artifactName: SuperCargo-OtherModes-R1-${version}-Portable.${ext}
  target:
    # nsis: Setup.exe, per-user installer that updates itself.
    # zip: the unpacked folder, run from anywhere; tells you about new versions only.
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # user data lives in %USERPROFILE%\SuperCargo (src/main/paths.ts) and is never
  # removed; this also keeps Electron's own cache folder.
  deleteAppDataOnUninstall: false
  shortcutName: SuperCargo-OtherModes
  # The desktop shortcut is optional and unticked: build/installer.nsh adds the
  # checkbox page, makes the shortcut and remembers the choice, so a silent
  # update keeps an existing shortcut. electron-builder's own desktop shortcut
  # handling is off so it neither creates nor deletes it.
  createDesktopShortcut: false
  include: build/installer.nsh
  artifactName: SuperCargo-OtherModes-R1-${version}-Setup.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Game
  synopsis: Star Citizen cargo hauling companion
  artifactName: SuperCargo-OtherModes-R1-${version}.${ext}
